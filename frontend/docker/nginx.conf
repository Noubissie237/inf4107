# Static server for the exported site (out/). Listens on 8080: no root privileges needed.
server {
    listen 8080;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain;

    error_page 404 /404.html;

    # Health check of the container (and of a load balancer)
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location = /404.html {
        internal;
    }

    # Runtime configuration: always read again
    location = /config.json {
        add_header Cache-Control "no-store";
    }

    # Build assets have a content hash in their name: cache them for a year
    location /_next/static/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Pages: /connexion/ is served from connexion/index.html
    location / {
        try_files $uri $uri/index.html =404;
    }
}
