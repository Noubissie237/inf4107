name: inf4107-prod

services:
  auth-service:
    build: ./auth-service
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://${DB_USER}:${DB_PASSWORD}@${DB_HOST}:5432/auth_db?sslmode=require
      STORAGE_BACKEND: s3
    ports:
      - "8001:8000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/auth/health')"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 30s

  grades-service:
    build: ./grades-service
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://${DB_USER}:${DB_PASSWORD}@${DB_HOST}:5432/grades_db?sslmode=require
    ports:
      - "8002:8000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/grades/health')"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 30s

  frontend:
    build: ./frontend
    environment:
      # Chemins relatifs : meme nom de domaine que l'ALB, donc pas de CORS
      AUTH_API_URL: ${AUTH_API_URL:-/api/auth}
      GRADES_API_URL: ${GRADES_API_URL:-/api/grades}
    ports:
      - "8080:8080"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8080/healthz"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s

  seed:
    build: ./seed
    profiles: ["tools"]
    environment:
      AUTH_DATABASE_URL: postgresql://${DB_USER}:${DB_PASSWORD}@${DB_HOST}:5432/auth_db?sslmode=require
      GRADES_DATABASE_URL: postgresql://${DB_USER}:${DB_PASSWORD}@${DB_HOST}:5432/grades_db?sslmode=require
      SEED_PASSWORD: ${SEED_PASSWORD}
      BCRYPT_ROUNDS: ${BCRYPT_ROUNDS:-10}
